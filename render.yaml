# Render.com blueprint. Dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: fuzzy-soil-dss
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Uncomment the two blocks below (and the disk) to keep the query log across deploys.
      # - key: SOIL_DB
      #   value: /var/data/soil.db
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
